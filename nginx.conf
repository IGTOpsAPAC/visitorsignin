server {
    listen 3006;
    server_name _;

    # Serve the app at /apps/vss/
    location /apps/vss/ {
        alias /usr/share/nginx/html/apps/vss/;
        index index.html;
        try_files $uri $uri/ /apps/vss/index.html;
    }

    # Redirect bare path to trailing slash
    location = /apps/vss {
        return 301 /apps/vss/;
    }

    # Health check endpoint
    location /apps/vss/health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
