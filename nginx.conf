server {
    listen 3006;
    server_name _;

    # Proxy API requests to the backend (internal Docker network only)
    location /apps/vss/api/ {
        proxy_pass http://vss-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Serve the app at /apps/vss/
    location /apps/vss/ {
        alias /usr/share/nginx/html/apps/vss/;
        index index.html;
        try_files $uri $uri/ /apps/vss/index.html;
    }

    # Redirect bare path
    location = /apps/vss {
        return 301 /apps/vss/;
    }

    # Health check
    location /apps/vss/health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
